[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poseidon-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "boto3>=1.34",
  "weasyprint>=62",
  "markdown>=3.6",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "anyio>=4"]

[tool.setuptools.packages.find]
include = ["poseidon*"]

[tool.pytest.ini_options]
testpaths = ["tests", "poseidon/tasks"]
addopts = "-q"
markers = [
  "pg: requires a reachable Postgres (DATABASE_URL)",
  "minio: requires reachable MinIO (S3_ENDPOINT_URL)",
  "pdf: requires weasyprint native libs (run in container)",
  "router_live: live LLM provider tests requiring credentials",
  "research_live: live Perplexity research tests requiring an API key",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
