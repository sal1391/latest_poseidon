# ---------------------------------------------------------------------------
# relationships: certified only; BOTH endpoints must be certified entities [S1].
# The seed has none — MARINE_SALES_PLANNING_V (sales POI grain) and
# W_MARINE_GL_SOURCE_AI (GL-string grain) do not join, and AR_INVOICES is only a
# planned slot. Candidate joins land in proposed/<key>.proposed.yml and are
# certified in here one at a time (30-70% of data-inferred FK proposals are false
# — check the orphan examples at certify time).
# ---------------------------------------------------------------------------

apps:

  # --- MARINE_SALES_PLANNING_V consumers (three archetypes) ------------------
  streamlit-in-snowflake-marine:
    root: archetypes/streamlit-in-snowflake
    entities: [MARINE_SALES_PLANNING_V]
    overrides:
      MARINE_SALES_PLANNING_V:
        # SiS skills playbook labels the win/inquiry/lost metrics "# Won" etc.
        # but keys them WON/INQUIRIES/LOST.
        metric_aliases: {NUM_WON: WON, NUM_INQUIRIES: INQUIRIES, NUM_LOST: LOST}

  table-chatbot-marine:
    root: archetypes/table-chatbot
    entities: [MARINE_SALES_PLANNING_V, AR_INVOICES]
    registry_path: registry.yml
    overrides:
      MARINE_SALES_PLANNING_V:
        metric_aliases: {NUM_WON: WON, NUM_INQUIRIES: INQUIRIES, NUM_LOST: LOST}
        # manifest_extra_columns is intentionally NOT set: the shipped
        # backend/tools/__init__.py::marine_config() TableConfig and
        # backend/tests/fixtures/sample_sales.csv key the port dimension as
        # PORT_NM, which is NOT a certified column (the real one is LOC_NM — see
        # MARINE_SALES_PLANNING_V.negative_constraints). PORT_NM would fail
        # ontology validation as a manifest_extra_column; reconcile PORT_NM ->
        # LOC_NM before pointing this app at the live table.
        manifest_note: shipped registry/TableConfig/fixture key the port dimension as PORT_NM; reconcile to LOC_NM (see negative_constraints) before live.

  research-platform-marine:
    root: archetypes/research-platform
    entities: [MARINE_SALES_PLANNING_V]
    overrides:
      MARINE_SALES_PLANNING_V:
        # research-platform uses the base metric names directly (NUM_WON etc.);
        # no metric_aliases needed. It exposes a 6-dimension SUBSET, order
        # preserved (segments/marine.yml `dimensions`); LOC_NM is the default
        # top-dimension breakdown.
        dimension_subset: [LOC_NM, CUST_NM, SUPPLIER_NM, SUPPLY_TEAM_NAME, DEAL_CLASSIFICATION_TRADE_CUT, VESSEL_DASHBOARD_SHIPTYPE_GRP]

  # --- W_MARINE_GL_SOURCE_AI consumer ----------------------------------------
  container-agent-app-marine-gl:
    root: archetypes/container-agent-app
    entities: [W_MARINE_GL_SOURCE_AI]
    # No metric/dimension aliasing: the container-agent-app consumes the
    # hierarchy structure + the single AMOUNT_USD measure directly; its query
    # shapes are deterministic templates, not per-app metric names.
